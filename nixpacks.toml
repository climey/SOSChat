# Railway (Nixpacks): além do Node, instala o Chromium usado pela pré-consulta de placa/chassi.
# O site de consulta barra conexões que não vêm de um navegador real; o Chromium abre sob demanda
# e fecha sozinho quando fica ocioso.
#
# Dois caminhos: o pacote "chromium" do nix e, se ele não estiver no PATH da imagem final, o
# scripts/ensure-chrome.sh baixa o Chrome for Testing em /app/.chrome (os aptPkgs são as bibliotecas
# que esse Chrome precisa). O servidor procura os dois e ignora o "atalho" do snap do Ubuntu.
[phases.setup]
nixPkgs = ['nodejs_22', 'chromium']
aptPkgs = ['ca-certificates', 'fonts-liberation', 'libasound2', 'libatk-bridge2.0-0', 'libatk1.0-0', 'libcairo2', 'libcups2', 'libdrm2', 'libgbm1', 'libgtk-3-0', 'libnss3', 'libpango-1.0-0', 'libx11-xcb1', 'libxcomposite1', 'libxdamage1', 'libxfixes3', 'libxkbcommon0', 'libxrandr2', 'libxshmfence1']

[phases.build]
cmds = ['sh scripts/ensure-chrome.sh']

[variables]
CHROME_PATH = 'chromium'
