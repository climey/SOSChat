<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · SOS Chat</title>
  <link rel="icon" href="/img/logo.svg">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="login-form" autocomplete="on">
      <div class="brand">
        <img src="/img/logo.svg" alt="">
        <div class="brand-name">SOS Chat<small>SOS Buscas Online</small></div>
      </div>
      <h1>Atendimento via WhatsApp</h1>
      <p>Entre com sua conta de atendente</p>
      <div class="field">
        <label class="label" for="email">E-mail</label>
        <input class="input" id="email" type="email" name="email" required autofocus>
      </div>
      <div class="field">
        <label class="label" for="password">Senha</label>
        <input class="input" id="password" type="password" name="password" required>
      </div>
      <button class="btn btn-primary" id="submit" type="submit" style="width:100%">Entrar</button>
      <div class="form-error" id="error"></div>
    </form>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
