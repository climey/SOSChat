<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caixa de entrada · SOS Chat</title>
  <link rel="icon" href="/img/logo.svg">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app">
  <!--RAIL-->
  <nav class="rail">
    <a class="rail-logo" href="/" title="SOS Chat"><img src="/img/logo.svg" alt="SOS Chat"></a>
    <a href="/" class="rail-btn active" title="Caixa de entrada">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span class="rail-badge" id="rail-unread" hidden>0</span>
    </a>
    <a href="/reports.html" class="rail-btn" title="Relatórios">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    </a>
    <a href="/settings.html" class="rail-btn" title="Configurações">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </a>
    <div class="rail-spacer"></div>
    <div class="rail-user" id="me-avatar" title=""></div>
    <button class="rail-btn" id="logout" title="Sair">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </nav>
  <!--/RAIL-->

  <main class="main">
    <section class="conv-list">
      <div class="list-head">
        <h2>Conversas</h2>
        <div class="list-actions">
          <button class="icon-btn" id="btn-filters" title="Filtros">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
          </button>
          <button class="icon-btn primary" id="btn-simulate" hidden title="Simular mensagem recebida (dev)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
      </div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="input" id="search" type="search" placeholder="Buscar por nome ou telefone">
      </div>
      <div class="list-tabs">
        <div class="seg" id="status-filters">
          <button class="active" data-status="inbox">Entrada <span class="cnt" id="cnt-active"></span></button>
          <button data-status="waiting">Esperando</button>
          <button data-status="resolved">Finalizados</button>
        </div>
      </div>
      <div class="filters-drawer" id="filters-drawer" hidden>
        <div class="chips" id="assigned-filters">
          <button class="chip active" data-assigned="all">Todos</button>
          <button class="chip" data-assigned="me">Minhas</button>
          <button class="chip" data-assigned="unassigned">Sem responsável</button>
        </div>
        <select class="select" id="tag-filter"><option value="">Todas as tags</option></select>
        <select class="select" id="account-filter" hidden><option value="">Todos os números</option></select>
        <button class="chip" id="filter-all-status" data-status="all">Ver todas (inclui finalizadas)</button>
      </div>
      <div class="conv-items" id="conv-items"></div>
    </section>

    <section class="chat" id="chat">
      <div class="empty" id="chat-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <div>Selecione uma conversa para começar o atendimento</div>
      </div>
      <div id="chat-panel" hidden style="display:flex;flex-direction:column;height:100%">
        <div class="chat-header">
          <div class="avatar" id="chat-avatar"></div>
          <div class="chat-head-info">
            <div class="title" id="chat-title"></div>
            <div class="chat-tags" id="chat-tags"></div>
          </div>
          <div class="actions">
            <button class="icon-btn" id="btn-assign-me" title="Assumir esta conversa">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg>
            </button>
            <button class="icon-btn" id="btn-details" title="Detalhes do contato, tags e responsável">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            </button>
            <button class="icon-btn success" id="btn-resolve" title="Finalizar conversa">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </button>
          </div>
        </div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="wa-banner" id="wa-banner" hidden></div>
        <div class="composer" id="composer">
          <div class="composer-top">
            <label class="switch" title="Coloca seu nome no início da mensagem enviada ao cliente">
              <input type="checkbox" id="sign-toggle"><span class="track"></span>
              <span>Assinar como <b id="sign-name"></b></span>
            </label>
            <div class="seg small" id="compose-mode">
              <button class="active" data-mode="message">Mensagem</button>
              <button data-mode="note">Nota interna</button>
            </div>
          </div>
          <form id="compose">
            <textarea id="compose-text" rows="1" placeholder="Digite sua mensagem…"></textarea>
            <div class="composer-bottom">
              <span class="hint" id="compose-hint">Enter envia · Shift+Enter quebra linha</span>
              <button class="btn btn-primary" type="submit" id="compose-send">Enviar</button>
            </div>
          </form>
        </div>
      </div>
    </section>

    <aside class="details" id="details" hidden>
      <h4>Contato</h4>
      <div class="contact">
        <div class="avatar" id="d-avatar"></div>
        <div><div class="name" id="d-name"></div><div class="phone" id="d-phone"></div></div>
      </div>
      <div class="field" style="margin-top:10px">
        <input class="input" id="d-name-input" placeholder="Nome do contato">
      </div>
      <h4>Status</h4>
      <div id="d-status"></div>
      <div class="small muted" id="d-times" style="margin-top:6px"></div>
      <h4>Responsável</h4>
      <select class="select" id="d-assignee"><option value="">Sem responsável</option></select>
      <h4>Tags</h4>
      <div class="tag-picker" id="d-tags"></div>
    </aside>
  </main>
</div>

<div class="modal-bg" id="sim-modal" hidden>
  <form class="modal" id="sim-form">
    <h3>Simular mensagem recebida</h3>
    <div class="field"><label class="label">Telefone (só números)</label><input class="input" id="sim-from" value="5511999990001"></div>
    <div class="field"><label class="label">Nome do cliente</label><input class="input" id="sim-name" value="Cliente Teste"></div>
    <div class="field"><label class="label">Mensagem</label><input class="input" id="sim-text" value="Olá, quero consultar a placa ABC1D23"></div>
    <div class="actions">
      <button type="button" class="btn" id="sim-cancel">Cancelar</button>
      <button type="submit" class="btn btn-primary">Enviar</button>
    </div>
  </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/api.js"></script>
<script src="/js/inbox.js"></script>
</body>
</html>
