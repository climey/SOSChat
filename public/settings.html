<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações · SOS Chat</title>
  <link rel="icon" href="/img/logo.svg">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app">
  <!--RAIL-->
  <nav class="rail">
    <a class="rail-logo" href="/" title="SOS Chat"><img src="/img/logo.svg" alt="SOS Chat"></a>
    <a href="/" class="rail-btn" title="Caixa de entrada">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span class="rail-badge" id="rail-unread" hidden>0</span>
    </a>
    <a href="/reports.html" class="rail-btn" title="Relatórios">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    </a>
    <a href="/settings.html" class="rail-btn active" title="Configurações">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </a>
    <div class="rail-spacer"></div>
    <div class="rail-user" id="me-avatar" title=""></div>
    <button class="rail-btn" id="logout" title="Sair">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </nav>
  <!--/RAIL-->

  <main class="main">
    <div class="page">
      <div class="page-header">
        <div><h1>Configurações</h1><p>Tags, atendentes e integração com o WhatsApp</p></div>
      </div>

      <div class="settings-grid">
        <div class="card">
          <h3>Tags / etiquetas</h3>
          <form class="inline-form" id="tag-form" data-admin-only>
            <input class="input" id="tag-name" placeholder="Nova tag (ex: Placa)" maxlength="40" required>
            <input class="color-input" type="color" id="tag-color" value="#E03131" title="Cor">
            <button class="btn btn-primary" type="submit">Adicionar</button>
          </form>
          <table class="table" id="tags-table"></table>
        </div>

        <div class="card">
          <h3>Atendentes</h3>
          <form class="inline-form" id="user-form" data-admin-only>
            <input class="input" id="user-name" placeholder="Nome" required>
            <input class="input" id="user-email" type="email" placeholder="E-mail" required>
            <input class="input" id="user-password" type="password" placeholder="Senha (mín. 8)" minlength="8" required autocomplete="new-password">
            <select class="select" id="user-role"><option value="agent">Atendente</option><option value="admin">Admin</option></select>
            <button class="btn btn-primary" type="submit">Adicionar</button>
          </form>
          <table class="table" id="users-table"></table>
        </div>
      </div>

      <div class="card" style="margin-top:20px" id="wa-card">
        <h3>Números de WhatsApp</h3>
        <p class="small muted" id="wa-help"></p>
        <form class="inline-form" id="wa-add-form" data-admin-only>
          <input class="input" id="wa-add-name" placeholder="Nome do número (ex.: Vendas, Suporte)" maxlength="60" required>
          <button class="btn btn-primary" type="submit">Adicionar número</button>
        </form>
        <div id="wa-accounts" class="wa-accounts"></div>
      </div>
    </div>
  </main>
</div>

<div class="modal-bg" id="pw-modal" hidden>
  <form class="modal" id="pw-form">
    <h3>Redefinir senha</h3>
    <p class="muted" id="pw-user"></p>
    <div class="field"><label class="label">Nova senha</label><input class="input" id="pw-value" type="password" minlength="8" required autocomplete="new-password"></div>
    <div class="actions">
      <button type="button" class="btn" id="pw-cancel">Cancelar</button>
      <button type="submit" class="btn btn-primary">Salvar</button>
    </div>
  </form>
</div>

<script src="/js/api.js"></script>
<script src="/js/settings.js"></script>
</body>
</html>
